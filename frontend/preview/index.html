<!doctype html>
<html lang="zh-CN" data-type="software">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="page-type" content="software">
    <meta name="site-kind" content="software">
    <meta name="description" content="电商客服的静态体验页，支持查询样例售后政策并查看条款引用。">
    <link rel="icon" href="data:,">
    <title>售后政策问答 · 电商智能客服</title>
  </head>
  <body>
    <header class="preview-header">
      <div class="preview-width preview-nav">
        <span class="preview-brand">电商智能客服</span>
        <a href="https://github.com/ifox-hu/ecommerce-support#3-快速开始">本地完整版 ↗</a>
      </div>
    </header>
    <main class="preview-width preview-main" data-enter>
      <section class="preview-intro" aria-labelledby="preview-title">
        <h1 id="preview-title">售后政策问答</h1>
        <p>直接输入问题，在浏览器里查询样例商城政策和条款来源。</p>
      </section>
      <div class="preview-workspace">
        <section class="preview-panel preview-question" aria-labelledby="question-title">
          <form id="question-form">
            <label id="question-title" for="question">你的问题</label>
            <textarea id="question" name="question" required maxlength="500" rows="4" placeholder="例如，退货运费由谁承担？"></textarea>
            <button class="preview-search" type="submit">查询政策</button>
          </form>
          <div class="preview-examples">
            <h2>试试这样问</h2>
            <button type="button" data-example>普通商品七天无理由退货需要什么条件？</button>
            <button type="button" data-example>退款一般多久到账？</button>
            <button type="button" data-example>活动赠品拆封了，主商品还能退吗？</button>
          </div>
        </section>
        <section class="preview-panel preview-answer" aria-labelledby="answer-title">
          <h2 id="answer-title">答复与条款</h2>
          <p id="answer-status" role="status">提交问题后，查询结果会显示在这里。</p>
          <ol id="answer-sources" aria-label="引用条款"></ol>
          <p class="preview-disclosure">条款为演示数据，适用于此体验页的样例商城。</p>
        </section>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
