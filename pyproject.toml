[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-support-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "httpx>=0.28,<1",
    "langgraph>=1.0.8,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-openai>=1,<2",
    "mcp>=1.26,<2",
    "redis>=6,<8",
    "PyMySQL[rsa]>=1.1,<2",
    "jieba==0.42.1",
    "sqlglot>=28,<32",
    "prometheus-client>=0.21,<1",
    "opentelemetry-sdk>=1.34,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.34,<2",
]

[project.optional-dependencies]
integrations = [
    "langchain>=1,<2",
    "typesafe-sdk>=0.1,<1",
    "pymilvus>=2.5.10,<2.6",
    "langfuse>=3.15,<4",
]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
